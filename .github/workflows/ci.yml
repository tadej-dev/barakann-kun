# プルリクエストごとに、フロントとAPIのテスト・ビルドを自動で実行する。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同じブランチで新しい実行が始まったら、古い実行は止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 本番依存に既知の脆弱性が入らないよう、CIでも監査する。
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      # テストと同時にカバレッジを計測し、検証済みの範囲をログに残す。
      - run: npm run test:coverage
      - run: npm run build
      # E2Eのspec・fixture・設定の型エラーもCIで検出する。
      - run: npm run e2e:typecheck

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # 本番依存に既知の脆弱性が入らないよう、CIでも監査する。
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      # マスターデータの欠落・不整合を検知する。監査はローカルD1を参照するため、先にマイグレーションを適用する。
      - run: npm run db:migrate:local
      - run: npm run master:audit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../api
      # ブラウザのダウンロード時間を短縮するため、Playwrightのキャッシュを使う。
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # APIとフロントをPlaywrightが起動し、E2E専用DBで実行する。
      - run: CI=1 npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
